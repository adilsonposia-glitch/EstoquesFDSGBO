<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Oferta de fim de semana — Adilson Baptista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=35">
</head>
<body>
  <header class="faixa">
    <img src="../.cursor/skills/supermarket-visual/assets/logo_supermarket.png" alt="Supermarket Rio de Janeiro">
    <div>
      <p class="faixa-marca">Oferta de fim de semana</p>
      <p>Quinta a domingo. Os arquivos ficam nesta máquina.</p>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <nav id="nav"></nav>
    </aside>
    <main class="main">
      <header class="top">
        <div>
          <h1 id="title">Capa</h1>
          <p class="sub" id="subtitle">Quinta a domingo. Os arquivos ficam nesta máquina.</p>
        </div>
        <div class="actions">
          <button type="button" id="pick">Escolher pasta</button>
          <button type="button" class="secondary" id="semana-periodo" hidden>Semana atual</button>
          <button type="button" class="secondary" id="semana-raiz" hidden>Semana anterior</button>
          <button type="button" class="secondary" id="reload">Atualizar</button>
          <button type="button" class="secondary" id="export">Exportar CSV</button>
        </div>
      </header>
      <p class="status" id="status">Lendo os arquivos da semana. Aguarde esta linha mudar.</p>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
      <section id="view"></section>
    </main>
  </div>
  <footer class="rodape">
    <div class="placa"><img src="../.cursor/skills/supermarket-visual/assets/logo_adilson_baptista.jpeg" alt="Adilson Baptista — Inteligência de negócio"></div>
  </footer>
  <script type="module" src="app.js?v=36"></script>
</body>
</html>
